<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sigmoid Demo</title>
    <style>
        /* تنسيق شكل الصفحة والخطوط */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 900px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-top: 0;
        }
        /* تنسيق لوحة الرسم */
        canvas {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 30px;
            max-width: 100%;
            height: auto;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        /* تنسيق شريط السحب (Slider) */
        input[type=range] {
            width: 90%;
            cursor: pointer;
            height: 8px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
        }
        /* تنسيق مربع عرض الأرقام */
        .info-box {
            background: #f8f9fa;
            padding: 15px 40px;
            border-radius: 8px;
            border-left: 6px solid #800080;
            font-size: 1.3em;
            display: flex;
            gap: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .value {
            font-weight: bold;
            color: #800080;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #555;
        }
        .legend span::before {
            content: '';
            display: inline-block;
            width: 15px;
            height: 3px;
            margin-right: 5px;
            vertical-align: middle;
        }
        .legend .sig::before { background: #800080; }
        .legend .der::before { background: #28a745; border-top: 2px dashed white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sigmoid Activation Function - Live Demo</h2>
        
        <div class="legend">
            <span class="sig">Sigmoid Function f(x)</span>
            <span class="der">Derivative f'(x)</span>
        </div>

        <canvas id="plotCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <input type="range" id="xSlider" min="-6" max="6" step="0.1" value="-5">
            
            <div class="info-box">
                <span>Input (x): <span class="value" id="xValDisplay">-5.0</span></span>
                <span>Output f(x): <span class="value" id="yValDisplay">0.007</span></span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('plotCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('xSlider');
        const xDisplay = document.getElementById('xValDisplay');
        const yDisplay = document.getElementById('yValDisplay');

        // إعدادات المحاور
        const xMin = -6, xMax = 6;
        const yMin = -0.1, yMax = 1.1;

        // المعادلات الرياضية
        function sigmoid(x) { return 1 / (1 + Math.exp(-x)); }
        function derivative(x) { const s = sigmoid(x); return s * (1 - s); }

        // تحويل القيم الرياضية لمقاسات الشاشة (Canvas)
        function mapX(x) { return ((x - xMin) / (xMax - xMin)) * canvas.width; }
        function mapY(y) { return canvas.height - ((y - yMin) / (yMax - yMin)) * canvas.height; }

        // دالة الرسم الرئيسية
        function draw() {
            // مسح الشاشة القديمة
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم الشبكة (Grid)
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            for(let i = Math.ceil(xMin); i <= Math.floor(xMax); i++) {
                ctx.beginPath(); ctx.moveTo(mapX(i), 0); ctx.lineTo(mapX(i), canvas.height); ctx.stroke();
            }
            for(let i = 0; i <= 10; i+=2) {
                let y = i/10;
                ctx.beginPath(); ctx.moveTo(0, mapY(y)); ctx.lineTo(canvas.width, mapY(y)); ctx.stroke();
            }

            // رسم المحاور الأساسية (X و Y)
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(mapX(0), 0); ctx.lineTo(mapX(0), canvas.height); ctx.stroke(); // Y-axis
            ctx.beginPath(); ctx.moveTo(0, mapY(0)); ctx.lineTo(canvas.width, mapY(0)); ctx.stroke(); // X-axis

            // رسم خط النهاية العظمى (Max = 1.0)
            ctx.strokeStyle = '#999';
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, mapY(1)); ctx.lineTo(canvas.width, mapY(1)); ctx.stroke();
            ctx.setLineDash([]); // إرجاع الخط لشكله الطبيعي

            // رسم دالة الـ Sigmoid
            ctx.strokeStyle = '#800080'; // لون بنفسجي
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            for(let x = xMin; x <= xMax; x += 0.05) {
                let cx = mapX(x);
                let cy = mapY(sigmoid(x));
                if(x === xMin) ctx.moveTo(cx, cy);
                else ctx.lineTo(cx, cy);
            }
            ctx.stroke();

            // رسم المشتقة (Derivative)
            ctx.strokeStyle = '#28a745'; // لون أخضر
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            for(let x = xMin; x <= xMax; x += 0.05) {
                let cx = mapX(x);
                let cy = mapY(derivative(x));
                if(x === xMin) ctx.moveTo(cx, cy);
                else ctx.lineTo(cx, cy);
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // النقطة الحمراء التفاعلية
            let currX = parseFloat(slider.value);
            let currY = sigmoid(currX);
            let px = mapX(currX);
            let py = mapY(currY);

            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(px, py, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // تحديث الأرقام المعروضة للمستخدم
            xDisplay.textContent = currX.toFixed(1);
            yDisplay.textContent = currY.toFixed(3);
        }

        // ربط حركة السلايدر بدالة الرسم
        slider.addEventListener('input', draw);
        
        // رسم الشاشة لأول مرة عند فتح الموقع
        draw();
    </script>
</body>
</html>
