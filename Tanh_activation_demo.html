<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Tanh Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf9f2; /* لون خلفية مائل للدفء */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(211, 84, 0, 0.1);
            text-align: center;
            max-width: 900px;
            width: 100%;
        }
        h2 {
            color: #d35400; /* برتقالي غامق */
            margin-top: 0;
        }
        canvas {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 30px;
            max-width: 100%;
            height: auto;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        input[type=range] {
            width: 90%;
            cursor: pointer;
            height: 8px;
            background: #fdebd0;
            border-radius: 5px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #d35400;
            cursor: pointer;
        }
        .info-box {
            background: #fff8f0;
            padding: 15px 40px;
            border-radius: 8px;
            border-left: 6px solid #d35400;
            font-size: 1.3em;
            display: flex;
            gap: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .value {
            font-weight: bold;
            color: #d35400;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #555;
        }
        .legend span::before {
            content: '';
            display: inline-block;
            width: 15px;
            height: 3px;
            margin-right: 5px;
            vertical-align: middle;
        }
        .legend .func::before { background: #d35400; }
        .legend .der::before { background: #f39c12; border-top: 2px dashed white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tanh Activation Function - Live Demo</h2>
        
        <div class="legend">
            <span class="func">Tanh Function f(x)</span>
            <span class="der">Derivative f'(x)</span>
        </div>

        <canvas id="plotCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <input type="range" id="xSlider" min="-5" max="5" step="0.1" value="-4">
            
            <div class="info-box">
                <span>Input (x): <span class="value" id="xValDisplay">-4.0</span></span>
                <span>Output f(x): <span class="value" id="yValDisplay">-0.999</span></span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('plotCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('xSlider');
        const xDisplay = document.getElementById('xValDisplay');
        const yDisplay = document.getElementById('yValDisplay');

        // إعدادات المحاور (Y من -1.5 لـ 1.5 عشان نوضح الـ bounds)
        const xMin = -5, xMax = 5;
        const yMin = -1.5, yMax = 1.5;

        // الدوال الرياضية
        function tanh(x) { return Math.tanh(x); }
        function derivative(x) { return 1 - Math.pow(Math.tanh(x), 2); }

        // التحويل لمقاسات الشاشة
        function mapX(x) { return ((x - xMin) / (xMax - xMin)) * canvas.width; }
        function mapY(y) { return canvas.height - ((y - yMin) / (yMax - yMin)) * canvas.height; }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم الشبكة
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            for(let i = Math.ceil(xMin); i <= Math.floor(xMax); i++) {
                ctx.beginPath(); ctx.moveTo(mapX(i), 0); ctx.lineTo(mapX(i), canvas.height); ctx.stroke();
            }
            for(let i = -15; i <= 15; i+=5) {
                let y = i/10;
                ctx.beginPath(); ctx.moveTo(0, mapY(y)); ctx.lineTo(canvas.width, mapY(y)); ctx.stroke();
            }

            // رسم المحاور X و Y
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(mapX(0), 0); ctx.lineTo(mapX(0), canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, mapY(0)); ctx.lineTo(canvas.width, mapY(0)); ctx.stroke();

            // رسم الحدود (Limits) عند 1 و -1
            ctx.strokeStyle = '#999';
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, mapY(1)); ctx.lineTo(canvas.width, mapY(1)); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, mapY(-1)); ctx.lineTo(canvas.width, mapY(-1)); ctx.stroke();
            ctx.setLineDash([]);

            // رسم دالة Tanh
            ctx.strokeStyle = '#d35400'; // برتقالي غامق
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            for(let x = xMin; x <= xMax; x += 0.05) {
                let cx = mapX(x);
                let cy = mapY(tanh(x));
                if(x === xMin) ctx.moveTo(cx, cy);
                else ctx.lineTo(cx, cy);
            }
            ctx.stroke();

            // رسم المشتقة
            ctx.strokeStyle = '#f39c12'; // برتقالي فاتح
            ctx.lineWidth = 2.5;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            for(let x = xMin; x <= xMax; x += 0.05) {
                let cx = mapX(x);
                let cy = mapY(derivative(x));
                if(x === xMin) ctx.moveTo(cx, cy);
                else ctx.lineTo(cx, cy);
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // النقطة التفاعلية
            let currX = parseFloat(slider.value);
            let currY = tanh(currX);
            let px = mapX(currX);
            let py = mapY(currY);

            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(px, py, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // تحديث الأرقام
            xDisplay.textContent = currX.toFixed(1);
            yDisplay.textContent = currY.toFixed(3);
        }

        slider.addEventListener('input', draw);
        draw();
    </script>
</body>
</html>
